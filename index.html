<html lang="ja">
<head>

<title>Luxcode Battler</title>

<style>
:root{--cy:#62f0ff;--am:#ffc45e;--rd:#ff5d73;--ink:#d6ecf5;--dim:#6d8898;--line:rgba(160,220,255,.13)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#010307;color:var(--ink);font-family:var(--font,"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif);overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#panel{position:fixed;top:0;right:0;width:360px;height:100%;overflow-y:auto;padding:18px 16px 16px;background:linear-gradient(180deg,rgba(6,16,28,.92),rgba(2,6,12,.96));border-left:1px solid rgba(98,240,255,.14);display:flex;flex-direction:column;gap:10px;font-size:13px;z-index:2}
#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:rgba(98,240,255,.2);border-radius:3px}
.brand{position:relative}.lang{position:absolute;right:0;top:0;padding:3px 6px;font-size:11px;letter-spacing:0;background:#0b1622;color:var(--ink);border:1px solid rgba(98,240,255,.3);border-radius:6px;font-family:inherit}
body.en #panel svg text{font-size:8.5px}
.brand{font-size:22px;font-weight:800;letter-spacing:.16em;color:#effcff;text-shadow:0 0 18px rgba(98,240,255,.55)}
.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:.42em;color:var(--dim);margin-top:3px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.022)}
.card.hot{border-color:rgba(255,93,115,.45);background:rgba(255,93,115,.06);box-shadow:0 0 22px rgba(255,93,115,.12)}
.card h3{margin:0 0 7px;font-size:10.5px;letter-spacing:.32em;color:var(--dim);font-weight:600}
.row{display:flex;gap:6px;margin-top:6px}
select,input{flex:1;min-width:0;background:#07131d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 7px;font:inherit}
input{font-family:Consolas,monospace;letter-spacing:.08em}
button{font:inherit;cursor:pointer}
.b{padding:6px 10px;border-radius:7px;border:1px solid rgba(98,240,255,.3);background:rgba(98,240,255,.07);color:#e8fbff;white-space:nowrap}
.b:hover:not(:disabled){background:rgba(98,240,255,.18);border-color:var(--cy)}
.b:disabled{opacity:.3;cursor:default}
.b.on{background:rgba(98,240,255,.22);border-color:var(--cy);box-shadow:0 0 12px rgba(98,240,255,.25)}
.b.x{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.b.red{border-color:rgba(255,93,115,.5);background:rgba(255,93,115,.12)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.big{width:100%;padding:11px;font-weight:800;letter-spacing:.14em;font-size:14px}
.wn{font-size:17px;font-weight:800;letter-spacing:.06em}
.sub{color:var(--dim);font-size:11.5px;margin-top:2px;line-height:1.5}
.stl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px;font-family:Consolas,monospace;font-size:12px}
.stl span{display:flex;flex-direction:column;align-items:center;padding:3px 0;border-radius:5px;background:rgba(255,255,255,.03)}
.stl i{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.15em}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid rgba(255,196,94,.35);color:#ffe0a8}
.chip.unk{border-color:var(--line);color:var(--dim)}.chip.hit{box-shadow:0 0 10px rgba(255,196,94,.5)}
.tech{display:grid;grid-template-columns:78px 1fr;gap:2px 8px;font-size:11.5px;line-height:1.45;padding:4px 0;border-top:1px dashed var(--line)}
.tech:first-of-type{border-top:0}
.tech b{color:#e8fbff}.tech span{color:#8aa6b5}
.tech.hit b{color:var(--am);text-shadow:0 0 10px rgba(255,196,94,.7)}
.aff svg{display:block;width:100%;height:auto}
#log{font-size:11.5px;line-height:1.65;color:#8fb0c0}
#log div::before{content:"› ";color:var(--dim)}
#msg{color:#ff9aa8;font-size:11.5px;min-height:1em;margin-top:4px}
#cmds{position:fixed;left:0;bottom:22px;width:calc(100% - 360px);display:flex;justify-content:center;flex-wrap:wrap;gap:10px;z-index:3;pointer-events:none;padding:0 16px}
#cmds button{pointer-events:auto;min-width:120px;padding:12px 18px;border-radius:10px;border:1px solid rgba(98,240,255,.4);background:rgba(4,20,32,.85);color:#effcff;font-weight:800;letter-spacing:.12em;font-size:15px;box-shadow:0 0 20px rgba(98,240,255,.12);backdrop-filter:blur(4px)}
#cmds button small{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:400;margin-top:2px}
#cmds button:hover:not(:disabled){background:rgba(98,240,255,.2);box-shadow:0 0 26px rgba(98,240,255,.35)}
#cmds button:disabled{opacity:.3;cursor:default}
#cmds button.it{border-color:rgba(255,196,94,.45);min-width:90px;font-size:13px}
#cmds button.xp{border-color:rgba(255,255,255,.5)}
#cmds button.tk{border-color:rgba(255,196,94,.6)}
#ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(4,18,30,.75),rgba(0,2,6,.94))}
#ov.on{display:flex}
#ov .box{text-align:center;padding:30px 40px;border:1px solid rgba(98,240,255,.25);border-radius:16px;background:rgba(2,10,18,.85)}
#ov h2{margin:0 0 6px;letter-spacing:.3em;font-size:26px;color:#effcff;text-shadow:0 0 24px rgba(98,240,255,.7)}
#ov p{color:#9fbccb;line-height:1.8;margin:8px 0 18px}
details>summary{cursor:pointer;font-size:10.5px;letter-spacing:.32em;color:var(--dim);font-weight:600;list-style:none}
details>summary::before{content:"▸ ";}details[open]>summary::before{content:"▾ ";}
details[open]>summary{margin-bottom:8px}
.fight{padding:14px;font-size:17px;letter-spacing:.4em;border-color:rgba(255,93,115,.55);background:rgba(255,93,115,.12);box-shadow:0 0 22px rgba(255,93,115,.15)}
.fight:hover:not(:disabled){background:rgba(255,93,115,.25)!important;border-color:#ff8a9a!important}
.save{width:100%;margin-top:8px;padding:9px;font-weight:800;letter-spacing:.3em}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 3px 6px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--ink);min-height:92px;cursor:pointer;font:inherit}
.slot img{width:58px;height:58px}
.slot b{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot i{font-style:normal;font-size:9.5px;color:var(--dim)}
.slot.empty{cursor:default;justify-content:center;color:var(--dim);font-size:11px;border-style:dashed}
.slot.sel{border-color:var(--cy);box-shadow:0 0 12px rgba(98,240,255,.25)}
.slot.ow{border-color:var(--am);cursor:pointer;animation:pulse 1s infinite}
.slot .aff{position:absolute;top:3px;right:5px;font-size:10px;font-weight:800}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,196,94,.5)}}
.slots.big{grid-template-columns:repeat(3,150px);gap:10px;justify-content:center}
.slots.big .slot{min-height:150px;padding:10px 6px}
.slots.big .slot img{width:90px;height:90px}
.slots.big .slot b{font-size:14px}
.slots.big .slot:hover:not(.empty){border-color:var(--cy);background:rgba(98,240,255,.08)}
#tools{position:fixed;z-index:3;display:flex;gap:8px;align-items:flex-start}
#tools .b{font-size:12px;background:rgba(4,16,26,.85)}
#cardPick>summary{padding:6px 10px;border-radius:7px;border:1px solid rgba(98,240,255,.3);background:rgba(4,16,26,.85);color:#e8fbff;letter-spacing:.05em;font-size:12px;font-weight:400}
#cardPick{position:relative}
#cardPick .pop{position:absolute;bottom:calc(100% + 6px);left:0;z-index:4;box-shadow:0 10px 40px rgba(0,0,0,.6);width:330px;padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(4,12,20,.97)}
#cardPick .pop select{width:100%}
#cardPick .lead{font-size:12px;line-height:1.7;color:#b9d3df;padding-bottom:8px;border-bottom:1px dashed var(--line)}
#cardPick .lead b{color:#ffe0a8}
#cardPick .ph{font-size:11px;color:var(--dim);margin:10px 0 2px;letter-spacing:.1em}
#cardPick>summary{border-color:rgba(255,196,94,.55)!important}
#pick{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(4,18,30,.8),rgba(0,2,6,.95))}
#pick.on{display:flex}
.pbox{text-align:center;padding:24px 30px;border:1px solid rgba(98,240,255,.25);border-radius:16px;background:rgba(2,10,18,.9);max-width:94vw}
.pbox h2{margin:0 0 4px;letter-spacing:.2em;font-size:22px;color:#effcff}
.pbox p{color:#9fbccb;margin:4px 0 16px;font-size:13px}
#pickOpts{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#pickOpts .b{padding:10px 16px;font-weight:700}
@media (max-width:900px){#panel{width:300px}#cmds{width:calc(100% - 300px)}.slots.big{grid-template-columns:repeat(3,110px)}}
</style>
</head>
