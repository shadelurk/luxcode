<style>
:root{--cy:#62f0ff;--am:#ffc45e;--rd:#ff5d73;--ink:#d6ecf5;--dim:#6d8898;--line:rgba(160,220,255,.13)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#010307;color:var(--ink);font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#panel{position:fixed;top:0;right:0;width:360px;height:100%;overflow-y:auto;padding:18px 16px 16px;background:linear-gradient(180deg,rgba(6,16,28,.92),rgba(2,6,12,.96));border-left:1px solid rgba(98,240,255,.14);display:flex;flex-direction:column;gap:10px;font-size:13px;z-index:2}
#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:rgba(98,240,255,.2);border-radius:3px}
.brand{font-size:22px;font-weight:800;letter-spacing:.16em;color:#effcff;text-shadow:0 0 18px rgba(98,240,255,.55)}
.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:.42em;color:var(--dim);margin-top:3px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.022)}
.card.hot{border-color:rgba(255,93,115,.45);background:rgba(255,93,115,.06);box-shadow:0 0 22px rgba(255,93,115,.12)}
.card h3{margin:0 0 7px;font-size:10.5px;letter-spacing:.32em;color:var(--dim);font-weight:600}
.row{display:flex;gap:6px;margin-top:6px}
select,input{flex:1;min-width:0;background:#07131d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 7px;font:inherit}
input{font-family:Consolas,monospace;letter-spacing:.08em}
button{font:inherit;cursor:pointer}
.b{padding:6px 10px;border-radius:7px;border:1px solid rgba(98,240,255,.3);background:rgba(98,240,255,.07);color:#e8fbff;white-space:nowrap}
.b:hover:not(:disabled){background:rgba(98,240,255,.18);border-color:var(--cy)}
.b:disabled{opacity:.3;cursor:default}
.b.on{background:rgba(98,240,255,.22);border-color:var(--cy);box-shadow:0 0 12px rgba(98,240,255,.25)}
.b.x{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.b.red{border-color:rgba(255,93,115,.5);background:rgba(255,93,115,.12)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.big{width:100%;padding:11px;font-weight:800;letter-spacing:.14em;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid rgba(255,196,94,.35);color:#ffe0a8}
.tech{display:grid;grid-template-columns:78px 1fr;gap:2px 8px;font-size:11.5px;line-height:1.45;padding:4px 0;border-top:1px dashed var(--line)}
.tech:first-of-type{border-top:0}
.tech b{color:#e8fbff}.tech span{color:#8aa6b5}
.tech.hit b{color:var(--am);text-shadow:0 0 10px rgba(255,196,94,.7)}
.aff svg{display:block;width:100%;height:auto}
#log{font-size:11.5px;line-height:1.65;color:#8fb0c0}
#log div::before{content:"› ";color:var(--dim)}
#msg{color:#ff9aa8;font-size:11.5px;min-height:1em;margin-top:4px}
#cmds{position:fixed;left:0;bottom:22px;width:calc(100% - 360px);display:flex;justify-content:center;flex-wrap:wrap;gap:10px;z-index:3;pointer-events:none;padding:0 16px}
#cmds button{pointer-events:auto;min-width:120px;padding:12px 18px;border-radius:10px;border:1px solid rgba(98,240,255,.4);background:rgba(4,20,32,.85);color:#effcff;font-weight:800;letter-spacing:.12em;font-size:15px;box-shadow:0 0 20px rgba(98,240,255,.12);backdrop-filter:blur(4px)}
#cmds button small{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:400;margin-top:2px}
#cmds button:hover:not(:disabled){background:rgba(98,240,255,.2);box-shadow:0 0 26px rgba(98,240,255,.35)}
#cmds button:disabled{opacity:.3;cursor:default}
#cmds button.it{border-color:rgba(255,196,94,.45);min-width:90px;font-size:13px}
#cmds button.xp{border-color:rgba(255,255,255,.5)}
#ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(4,18,30,.75),rgba(0,2,6,.94))}
#ov.on{display:flex}
#ov .box{text-align:center;padding:30px 40px;border:1px solid rgba(98,240,255,.25);border-radius:16px;background:rgba(2,10,18,.85)}
#ov h2{margin:0 0 6px;letter-spacing:.3em;font-size:26px;color:#effcff;text-shadow:0 0 24px rgba(98,240,255,.7)}
#ov p{color:#9fbccb;line-height:1.8;margin:8px 0 18px}
@media (max-width:900px){#panel{width:300px}#cmds{width:calc(100% - 300px)}}
</style>

<body>
<canvas id="cv"></canvas>
<div id="panel">
  <div class="brand">ラックスコード<small>LUXCODE BARCODE BATTLER</small></div>
  <div class="card hot" id="chBox" style="display:none"></div>
  <div class="card">
    <h3>CARD</h3>
    <div class="row" style="margin-top:0"><select id="preset"></select></div>
    <div class="row"><input id="jan" maxlength="13" placeholder="JANコード 8 / 12 / 13桁"><button class="b" id="janBtn">作成</button></div>
    <div class="row"><button class="b" id="rndBtn" style="flex:1">ランダム</button><button class="b on" id="insR" style="flex:1">右から差込</button><button class="b" id="insL" style="flex:1">左から差込</button></div>
    <div id="msg"></div>
  </div>
  <div class="card"><h3>読み取り先</h3><div class="seg"><button class="b on" id="tSelf">自分の戦士</button><button class="b" id="tEnemy">対戦相手</button></div></div>
  <div class="card" id="heroBox"></div>
  <button class="b big" id="towerBtn">バトルタワーに挑む</button>
  <div class="card aff"><h3>属性相性</h3>
    <svg viewBox="0 0 220 150" aria-label="属性相性図">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ffc45e"/></marker></defs>
      <g stroke="#ffc45e" stroke-width="1.6" fill="none" marker-end="url(#ah)" opacity=".8">
        <path d="M128,24 Q170,34 180,62"/><path d="M180,90 Q170,118 128,128"/><path d="M92,128 Q50,118 40,90"/><path d="M40,62 Q50,34 92,24"/>
      </g>
      <g font-size="17" font-weight="800" text-anchor="middle" font-family="Yu Gothic UI,sans-serif">
        <circle cx="110" cy="20" r="15" fill="rgba(255,90,40,.15)" stroke="hsl(14,100%,65%)"/><text x="110" y="26" fill="hsl(14,100%,75%)">焔</text>
        <circle cx="190" cy="76" r="15" fill="rgba(60,255,160,.12)" stroke="hsl(150,100%,60%)"/><text x="190" y="82" fill="hsl(150,100%,75%)">嵐</text>
        <circle cx="110" cy="132" r="15" fill="rgba(255,200,60,.12)" stroke="hsl(40,100%,60%)"/><text x="110" y="138" fill="hsl(40,100%,75%)">岩</text>
        <circle cx="30" cy="76" r="15" fill="rgba(60,160,255,.15)" stroke="hsl(205,100%,65%)"/><text x="30" y="82" fill="hsl(205,100%,78%)">潮</text>
        <circle cx="110" cy="76" r="15" fill="rgba(170,80,255,.15)" stroke="hsl(278,100%,70%)"/><text x="110" y="82" fill="hsl(278,100%,80%)">虚</text>
      </g>
    </svg>
    <div class="sub">矢印の先に有利（与ダメ×1.3）、逆向きは不利（×0.8）。虚は誰に対しても与ダメ・被ダメともに×1.1。<br>技の相性：防御は被ダメ半減、疾風刃は防御を貫通、地殻割はDFを無視、虚喰は相手HPが多いほど効く。</div>
  </div>
  <div class="card"><h3>読み取り技</h3><div id="techs"></div></div>
  <div id="log"></div>
</div>
<div id="cmds"></div>
<div id="ov"><div class="box"><h2 id="ovT">REPLAY</h2><p id="ovP"></p><button class="b big" id="ovB">再生する</button></div></div>
<script>
'use strict';
const PUBLIC_URL='https://shadelurk.github.io/luxcode/';
const $=id=>document.getElementById(id);
const cv=$('cv');let ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const hsla=(h,s,l,a)=>`hsla(${h},${s}%,${l}%,${a})`;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= EAN-13 =================
const LC=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const GC=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const RC=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function encode(d){let b='101';for(let i=1;i<=6;i++)b+=(PAR[d[0]][i-1]==='L'?LC:GC)[d[i]];b+='01010';for(let i=7;i<=12;i++)b+=RC[d[i]];return b+'101';}
function cdig(d){let s=0;for(let i=0;i<12;i++)s+=d[i]*(i%2?3:1);return (10-s%10)%10;}
function ham(a,b){let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n;}
function decode(b){
  let dist=ham(b.slice(0,3),'101');const dg=[],par=[];
  for(let i=0;i<6;i++){const ch=b.substr(3+i*7,7);let best=null;
    for(let n=0;n<10;n++)for(const [tb,p] of [[LC,'L'],[GC,'G']]){const h=ham(ch,tb[n]);if(!best||h<best.h)best={h,n,p};}
    dg.push(best.n);par.push(best.p);dist+=best.h;}
  dist+=ham(b.substr(45,5),'01010');
  for(let i=0;i<6;i++){const ch=b.substr(50+i*7,7);let best=null;
    for(let n=0;n<10;n++){const h=ham(ch,RC[n]);if(!best||h<best.h)best={h,n};}
    dg.push(best.n);dist+=best.h;}
  dist+=ham(b.substr(92,3),'101');
  const ps=par.join('');let f=0,fh=99;PAR.forEach((p,i)=>{const h=ham(p,ps);if(h<fh){fh=h;f=i;}});
  return {digits:[f,...dg],dist:dist+fh};
}

// ================= read techniques =================
const TECH={
  NORMAL:  {jp:'正読み',  en:'STRAIGHT',      how:'右から差込、左へ一気に通す。'},
  REVERSE: {jp:'逆読み',  en:'REVERSE',       how:'左から差込、右へ通す。攻守と属性が反転。'},
  TSUBAME: {jp:'燕返し',  en:'TSUBAME-GAESHI',how:'中央ガード（黄色の帯）で折り返して右へ引き抜き、1秒以内に最初から通し直す。'},
  RTSUBAME:{jp:'逆燕返し',en:'REVERSE TSUBAME',how:'左から差込で燕返し。'},
  DOUBLE:  {jp:'二度読み',en:'DOUBLE READ',   how:'中央以外で折り返して引き抜き、1秒以内に通し直す。折返し位置で結果が変わる。'},
  ROUND:   {jp:'往復返し',en:'ROUND TRIP',    how:'最後まで通し、全部戻し、もう一度通す。'},
  DRAGBACK:{jp:'引き戻し',en:'DRAG BACK',     how:'通し切った直後、1秒以内に途中まで引き戻す。'},
  CHAOS:   {jp:'乱れ読み',en:'CHAOS',         how:'4回以上ジグザグに往復させた末に全ての線を読ませる。'},
  IRREGULAR:{jp:'変則読み',en:'IRREGULAR',    how:'その他の不規則な動き。'},
};
function segment(path){
  const segs=[];if(!path.length)return segs;
  let start=path[0],dir=0,ext=path[0];
  for(let i=1;i<path.length;i++){const p=path[i];
    if(dir===0){if(p!==start){dir=Math.sign(p-start);ext=p;}}
    else if((p-ext)*dir>0)ext=p;
    else if((ext-p)*dir>=3){segs.push({from:start,to:ext,dir});start=ext;dir=-dir;ext=p;}
  }
  segs.push({from:start,to:ext,dir:dir||1});
  return segs;
}
const isFull=s=>Math.min(s.from,s.to)<=0&&Math.max(s.from,s.to)>=94;
const MIDLO=43,MIDHI=51;
function classify(segs){
  const n=segs.length;
  if(n===1)return segs[0].dir>0?'NORMAL':'REVERSE';
  if(n>=5)return 'CHAOS';
  if(n===3){const [a,b,c]=segs;
    if(a.dir>0&&a.from<=0&&b.to<=2&&isFull(c))return a.to>=MIDLO&&a.to<=MIDHI?'TSUBAME':a.to>=94?'ROUND':'DOUBLE';
    if(a.dir<0&&a.from>=94&&b.to>=92&&isFull(c))return a.to>=MIDLO&&a.to<=MIDHI?'RTSUBAME':a.to<=0?'ROUND':'DOUBLE';
  }
  if(n===2&&isFull(segs[0]))return 'DRAGBACK';
  return 'IRREGULAR';
}
function cleanModules(segs){
  const mods=[];
  segs.forEach((s,i)=>{for(let m=s.from;;m+=s.dir){if(m>=0&&m<=94&&!(i>0&&m===s.from))mods.push(m);if(m===s.to)break;}});
  return mods;
}
function coverSegs(segs){const seen=new Set();for(const s of segs)for(let m=s.from;;m+=s.dir){if(m>=0&&m<=94)seen.add(m);if(m===s.to)break;}return seen.size===95;}
// read record: insertion side + every turning point. The whole warrior is re-derived from (card, record).
function recOf(segs){return (segs[0].from<0?'R':'L')+segs.map(s=>s.to<0?'n':s.to>94?'p':s.to).join('.');}
function segsOf(rec){
  if(!/^[RL][0-9np.]+$/.test(rec))return null;
  let from=rec[0]==='R'?-1:95,pd=0;const segs=[],toks=rec.slice(1).split('.');
  if(toks.length>40)return null;
  for(const t of toks){
    const to=t==='n'?-1:t==='p'?95:(/^\d{1,2}$/.test(t)?+t:NaN);
    if(isNaN(to)||to>95||to===from)return null;
    const dir=Math.sign(to-from);if(dir===pd)return null;
    segs.push({from,to,dir});pd=dir;from=to;
  }
  return segs;
}
function readFromSegs(code,segs){
  if(!coverSegs(segs))return {error:'READ ERROR',sub:'バーコードの全ての線をまだ読み取れていません。'};
  const d=[...code].map(Number),bars=encode(d),tech=classify(segs),mods=cleanModules(segs);
  let b=mods.map(m=>bars[m]).join('').slice(0,95).padEnd(95,'0');
  if(segs[0].dir<0)b=[...b].reverse().join('');
  const dec=decode(b),valid=cdig(dec.digits)===dec.digits[12],w=makeWarrior(dec.digits,tech,dec.dist,valid);
  w.card=code;w.rec=recOf(segs);w.id=code+'-'+w.rec;
  return {tech,w,turn:segs.length>1?segs[0].to:null,dist:dec.dist};
}
function warriorFromId(id){
  const m=/^(\d{13})-([RL][0-9np.]+)$/.exec(id||'');if(!m)return null;
  const d=[...m[1]].map(Number);if(cdig(d)!==d[12])return null;
  const segs=segsOf(m[2]);if(!segs)return null;
  const r=readFromSegs(m[1],segs);return r.error||r.w.kind!=='warrior'?null:r.w;
}

// ================= warriors =================
const ELS=['fire','fire','water','water','wind','wind','earth','earth','void'];
const ELJP={fire:'焔',water:'潮',wind:'嵐',earth:'岩',void:'虚'};
const ELHUE={fire:14,water:205,wind:150,earth:40,void:278};
const OPP={fire:'water',water:'fire',wind:'earth',earth:'wind',void:'void'};
const BEATS={fire:'wind',wind:'earth',earth:'water',water:'fire'};
const SKILL={
  blaze:{jp:'紅蓮撃',desc:'威力1.9倍'},tide:{jp:'潮還し',desc:'威力1.5倍、与えたダメージの40%回復'},
  gale:{jp:'疾風刃',desc:'威力1.6倍、防御を貫通'},quake:{jp:'地殻割',desc:'相手DFを無視して1.4倍'},
  null:{jp:'虚喰',desc:'相手の残りHPの25%＋ST×0.8'},tsubame:{jp:'燕返し',desc:'1.15倍の二連斬'},
  double:{jp:'双読撃',desc:'PP5で威力1.6倍'},round:{jp:'環光',desc:'1.5倍＋最大HPの10%回復'},
  guard:{jp:'返し構え',desc:'1.5倍＋そのターンの被ダメ半減'},chaos:{jp:'乱数撃',desc:'威力0.3〜3.0倍'},
};
const spCost=s=>s==='double'?5:10;
const SYL=['ア','イ','ウ','エ','オ','カ','キ','ク','ケ','コ','ガ','ギ','グ','ゲ','ゴ','サ','シ','ス','セ','ソ','ザ','ジ','ズ','ゼ','ゾ','タ','チ','ツ','テ','ト','ダ','デ','ド','ナ','ニ','ネ','ノ','ハ','ヒ','フ','ヘ','ホ','バ','ビ','ブ','ベ','ボ','マ','ミ','ム','メ','モ','ラ','リ','ル','レ','ロ','ヴァ','ヴィ','ヴォ'];
const ITEMS=[{name:'回復の雫',d:'HP回復'},{name:'力の結晶',d:'ST上昇'},{name:'守りの殻',d:'DF上昇'},{name:'光の欠片',d:'PP全快'}];
function makeShape(d){
  const sym=3+d[3]%6,n=2+d[5]%3,layers=[];
  for(let L=0;L<n;L++){
    const r0=.12+L*.1,r1=.35+d[(L*3+2)%13]/9*.3;
    layers.push({kind:(d[8+L%4]+L)%4,r0,r1,r2:Math.min(1.05,r1+.18+d[(L*5+1)%13]/9*.4),w:.06+d[(L*7+4)%13]/9*.12,
      spin:((d[(L+11)%13]%5)-2)*.12||.05,mult:L===0?1:(d[L]%2?2:1),dh:L*14*((d[12]%3)-1)});
  }
  return {sym,layers,core:.16+d[1]/9*.12,sat:d[9]%4};
}
function makeWarrior(d,tech,dist,valid){
  const code=d.join(''),e10=(d[6]+d[7])%10;
  if(e10===9){const t=d[10]%4;return {kind:'item',type:t,name:ITEMS[t].name,val:[1500+d[11]*150,200+d[11]*40,150+d[11]*35,0][t],code,digits:d,tech,valid,hue:48,shape:makeShape(d)};}
  let el=ELS[e10];
  let hp=2000+Math.round((d[2]*1000+d[3]*100+d[4]*10+d[5])*.8);
  let st=400+(d[8]*100+d[9]*10+d[10])*2;
  let df=300+Math.round((d[1]*100+d[11]*10+d[7])*1.5);
  let spd=10+((d[4]*7+d[9]*3+d[12]*11)%90);
  let pp=10+d[0]+d[12];
  let skill={fire:'blaze',water:'tide',wind:'gale',earth:'quake',void:'null'}[el],pre='';
  switch(tech){
    case 'REVERSE':[st,df]=[Math.round(df*1.25),Math.round(st*.8)];el=OPP[el];pre='裏';break;
    case 'TSUBAME':case 'RTSUBAME':{const m=1.15+Math.min(.25,dist*.006);hp*=m;st*=m;df*=m;spd+=15;skill='tsubame';pre='燕';break;}
    case 'DOUBLE':hp*=1.08;st*=1.08;skill='double';pre='双';break;
    case 'ROUND':hp*=1.12;df*=1.1;skill='round';pre='環';break;
    case 'DRAGBACK':df*=1.3;skill='guard';pre='戻';break;
    case 'CHAOS':{const a=d[3]%4,b=(a+1+d[9]%3)%4,arr=[hp,st,df,spd];arr[a]*=1.7;arr[b]*=.6;[hp,st,df,spd]=arr;skill='chaos';pre='乱';break;}
    case 'IRREGULAR':hp*=1.05;st*=1.05;pre='変';break;
  }
  if(!valid)hp*=1.1;
  hp=Math.round(hp);st=Math.round(st);df=Math.round(df);spd=clamp(Math.round(spd),1,150);

// ================= scanning =================
function scanUpdate(now,dt){

  if(G.ret){const r=G.ret;r.t=Math.min(1,r.t+dt/.45);G.cardX=r.from+(r.to-r.from)*ease(r.t);if(r.t>=1)G.ret=null;G.lastIdx=idxAt(g);return;}
  const idx=idxAt(g);
  if(idx!==G.lastIdx){
    const st=Math.sign(idx-G.lastIdx);
    for(let m=G.lastIdx+st;;m+=st){
      const inside=m>=0&&m<=94;
      if(inside&&!G.sess){G.sess={path:[{t:now,idx:G.lastIdx}],t0:now,lastTouch:now};G.trace=G.sess;G.reveal=null;}
      if(G.sess){G.sess.path.push({t:now,idx:m});
        if(inside){G.sess.lastTouch=now;
          if(G.card.bars[m]==='1'&&(m===0||G.card.bars[m-1]==='0')&&now-G.lastTick>14){G.lastTick=now;snd(700+m*9,.018,'square',.006);}}}
      if(m===idx)break;
    }

  }
  const s=G.sess;
  if(s){const inside=idx>=0&&idx<=94;
    if(!inside&&now-s.lastTouch>GRACE)finalize(now);
    else if(inside&&now-s.lastTouch>1500&&covered(s))finalize(now);
    else if(inside&&now-s.lastTouch>3000)finalize(now,'timeout');}
}

  const res=reason==='timeout'?{error:'読み取り中断',sub:'バーコードの上で止まったまま3秒経過しました。'}:readFromSegs(G.card.code,segs);
  if(!res.error)s.tech=res.tech;
  G.reveal={t0:now,res};

  if(res.tech==='NORMAL'){snd(1250,.07,'square',.03);snd(1650,.12,'square',.03,0,.09);}
  else{[0,1,2,3].forEach(i=>snd(700*Math.pow(1.26,i),.12,'triangle',.04,0,i*.07));}
  const turn=res.turn!=null?`（折返し ${res.turn}）`:'';

    setTarget('self');setTimeout(()=>{if(G.mode==='scan'&&G.challenger===w)startBattle(G.hero,w,{mode:'duel',label:'フリー対戦'});},2600);

// ================= battle: deterministic engine =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const rr=(a,b)=>a+B.rng()*(b-a);
function fighter(w,scale,side,hp){
  const mh=Math.round(w.hp*scale);
  return {w,side,name:w.name,el:w.el,hue:w.hue,maxhp:mh,hp:hp??mh,st:Math.round(w.st*scale),df:Math.round(w.df*scale),spd:w.spd,
    pp:w.pp,maxpp:w.pp,skill:w.skill,defending:false,hit:0,lunge:0,ko:false,dhp:hp??mh};
}
function startBattle(pw,ew,opts){
  if(G.mode==='battle'||!pw||!ew)return;
  const seed=opts.seed??((Math.random()*4294967296)>>>0);
  G.mode='battle';G.dragging=false;G.sess=null;
  B={p:fighter(pw,1,0,opts.hp),e:fighter(ew,opts.scale||1,1),opts,seed,rng:mulberry32(seed),inputs:[],
    replayIn:opts.inputs?opts.inputs.slice():null,broken:false,
    round:1,fx:[],parts:[],floats:[],gauge:null,gres:null,gmark:null,banner:null,result:null,ask:null,endRes:null,
    shake:0,flash:null,cam:{x:0,y:0,z:1},camT:{x:0,y:0,z:1},ts:1,stop:0,vt:0,intro:0,introOn:true,introRes:null,glitch:0,
    stars:Array.from({length:110},()=>({x:Math.random(),y:Math.random()*.62,z:Math.random(),p:Math.random()*TAU}))};
  log(`${opts.label}：${B.p.name} vs ${B.e.name}`,'#ffe0a8');
  renderPanel();renderCmds();
  runBattle();
}
function cpuCmd(e){
  if(e.pp>=spCost(e.skill)&&B.rng()<.42)return {type:'special'};
  if(e.hp<e.maxhp*.3&&B.rng()<.3)return {type:'defend'};
  return {type:'attack'};
}
function gaugePos(ms){const u=(ms/800)%2;return u<1?u:2-u;}
function gaugeMult(g){if(g==='x')return .8;const d=Math.abs(g/1000-.5);return d<.05?1.35:d<.16?1.15:.85;}
const gaugeLabel=g=>g==='x'?'MISS':Math.abs(g/1000-.5)<.05?'PERFECT':Math.abs(g/1000-.5)<.16?'GOOD':'MISS';
function gauge(){return new Promise(res=>{B.gauge={t0:performance.now(),res};});}
function stopGauge(){
  const g=B&&B.gauge;if(!g||g.replay!=null)return;
  const ms=performance.now()-g.t0,v=ms>3200?'x':Math.round(gaugePos(ms)*1000);
  finishGauge(v);
}
function finishGauge(v){
  const g=B.gauge;B.gauge=null;const l=gaugeLabel(v);B.gres={l,t:0};B.gmark={pos:v==='x'?null:v/1000,t:0};
  snd(l==='PERFECT'?1800:l==='GOOD'?1200:300,.1,'square',.03);g.res(v);
}
function replayGauge(v){return new Promise(res=>{B.gauge={t0:performance.now(),res,replay:v};});}
async function askCommand(){
  if(B.replayIn){
    await sleep(450);
    const tok=B.replayIn.shift();
    if(!tok){B.broken=true;return {type:'defend'};}
    const t=tok[0],g=tok.slice(1);
    if(t==='d')return {type:'defend'};
    const gv=g==='x'?'x':(/^\d{1,4}$/.test(g)&&+g<=1000?+g:null);
    if(gv==null||(t!=='a'&&t!=='s')){B.broken=true;return {type:'defend'};}
    if(t==='s'&&B.p.pp<spCost(B.p.skill)){B.broken=true;return {type:'attack',g:gv};}
    return {type:t==='s'?'special':'attack',g:gv};
  }
  return new Promise(res=>{B.ask=res;renderCmds();});
}
function intro(){return new Promise(res=>{B.introRes=res;snd(90,1.6,'sawtooth',.03,.5);noise(1.2,.04,400);});}
async function runBattle(){
  const {p,e}=B;
  await intro();
  B.introOn=false;renderCmds();
  while(p.hp>0&&e.hp>0){
    const pc=await askCommand(),ec=cpuCmd(e);
    p.defending=pc.type==='defend'||(pc.type==='special'&&p.skill==='guard');
    e.defending=ec.type==='defend'||(ec.type==='special'&&e.skill==='guard');
    const pf=p.spd>e.spd||(p.spd===e.spd&&B.rng()<.5);
    const order=pf?[[p,e,pc],[e,p,ec]]:[[e,p,ec],[p,e,pc]];
    for(const [a,d,c] of order){if(a.hp<=0||d.hp<=0)break;await act(a,d,c);await sleep(300);}
    for(const f of [p,e]){f.pp=Math.min(f.maxpp,f.pp+2);f.defending=false;}
    if(p.hp>0&&e.hp>0)B.round++;
    B.camT={x:0,y:0,z:1};
  }
  const win=p.hp>0;B.result=win?'WIN':'LOSE';
  snd(win?880:160,.8,win?'triangle':'sawtooth',.05,win?1.5:.5);
  if(B.opts.mode==='replay')log(`再生完了：${win?p.name:e.name} の勝利${B.broken?'（記録に不整合あり）':'（検証済み）'}`,'#ffe0a8');
  else if(win)log(`勝利！ ${e.name} を撃破`,'#9fe6f2');else log(`敗北… ${p.name} は倒れた`,'#ff9aa8');
  await sleep(900);
  const action=await new Promise(res=>{B.endRes=res;renderCmds();});
  endBattle(win,action);
}
async function act(a,d,c){
  if(c.type==='defend'){
    if(a.side===0)B.inputs.push('d');
    a.pp=Math.min(a.maxpp,a.pp+4);float(a,'防御','#9fe6f2');B.fx.push({type:'hex',f:a,t:0,max:.9,hue:190});snd(420,.3,'triangle',.03,1.4);
    log(`${a.name} は身構えた`);await sleep(520);return;
  }
  if(c.type==='item'){
    const it=G.items.splice(c.item,1)[0];if(!it)return;
    if(it.type===0){const v=Math.min(it.val,a.maxhp-a.hp);a.hp+=v;float(a,`+${v}`,'#8dffb0');}
    else if(it.type===1){a.st+=it.val;float(a,`ST+${it.val}`,'#ffc45e');}
    else if(it.type===2){a.df+=it.val;float(a,`DF+${it.val}`,'#ffc45e');}
    else{a.pp=a.maxpp;float(a,'PP MAX','#ffc45e');}
    burst(wpos(a),48,40,300,.8);snd(990,.25,'triangle',.04,1.5);log(`${a.name} は ${it.name} を使った`);renderPanel();await sleep(700);return;
  }
  let special=c.type==='special';
  if(special&&a.pp<spCost(a.skill))special=false;
  if(special){a.pp-=spCost(a.skill);B.banner={text:SKILL[a.skill].jp,sub:SKILL[a.skill].desc,hue:a.hue,t:0};
    const [tx]=wpos(d);B.camT={x:tx*.3,y:0,z:1.12};snd(300,.7,'sawtooth',.03,2.5);charge(a,.6);await sleep(700);}
  let m;
  if(a.side===0){
    const g=c.g!=null?await replayGauge(c.g):await gauge();
    m=gaugeMult(g);B.inputs.push((special?'s':'a')+g);
  }else m=rr(.85,1.2);
  const hits=special&&a.skill==='tsubame'?2:1;
  for(let h=0;h<hits;h++){
    if(d.hp<=0)break;
    let mult=m,ignDF=false,ignDef=false,flat=0;
    if(special)switch(a.skill){
      case 'blaze':mult*=1.9;break;case 'tide':mult*=1.5;break;case 'gale':mult*=1.6;ignDef=true;break;
      case 'quake':mult*=1.4;ignDF=true;break;case 'null':flat=d.hp*.25;mult*=.8;break;case 'tsubame':mult*=1.15;break;
      case 'double':mult*=1.6;break;case 'round':case 'guard':mult*=1.5;break;case 'chaos':mult*=rr(.3,3);break;
    }
    let v=Math.max(a.st*mult*rr(.92,1.08)-(ignDF?0:d.df*.55),a.st*.12*mult)+flat;
    const em=elemMult(a.el,d.el);v*=em;if(d.defending&&!ignDef)v*=.5;v=Math.round(v);
    await choreo(a,d,special,h);
    impact(a,d,special);
    d.hp=Math.max(0,d.hp-v);
    float(d,String(v),special?'#ffd28a':'#ffffff',special?1.5:1.1);
    if(h===0&&em>1.05)float(d,`相性◎ ×${em.toFixed(2)}`,'#ffc45e',.62,-.9);
    else if(h===0&&em<.95)float(d,`相性× ×${em.toFixed(2)}`,'#8fb0ff',.62,-.9);
    if(special&&a.skill==='tide'){const hv=Math.min(Math.round(v*.4),a.maxhp-a.hp);a.hp+=hv;if(hv){float(a,`+${hv}`,'#8dffb0');drain(d,a,205);}}
    if(special&&a.skill==='round'){const hv=Math.min(Math.round(a.maxhp*.1),a.maxhp-a.hp);a.hp+=hv;if(hv)float(a,`+${hv}`,'#8dffb0');}
    await sleep(hits>1?120:260);
  }
  if(d.hp<=0)await ko(d,a);
  B.camT={x:0,y:0,z:1};
}

// ================= battle: choreography =================
const SPAN=()=>CW*.2;
const ER=()=>Math.min(CW*.115,H*.165);
const FLOOR=()=>ER()*1.35;
function wpos(f){return [(f.side?1:-1)*SPAN(),0];}
function charge(f,dur,h){const [x,y]=wpos(f),R=ER();for(let i=0;i<34;i++){const a=Math.random()*TAU,r=R*rand(1.4,2.6);
  B.parts.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,tx:x,ty:y,h:h??f.hue,life:dur*rand(.6,1),max:dur,r:rand(2,4.5)*k,pull:true});}}
function burst([x,y],h,n,sp,life,up=0){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=sp*(.2+Math.random());
  B.parts.push({x,y,vx:Math.cos(a)*v*k,vy:Math.sin(a)*v*k-up*k,h:h+rand(-15,15),life:life*(.4+Math.random()*.6),max:life,r:(2+Math.random()*3)*k});}}
function drain(from,to,h){const [x,y]=wpos(from),[tx,ty]=wpos(to);for(let i=0;i<24;i++)B.parts.push({x:x+rand(-30,30)*k,y:y+rand(-30,30)*k,tx,ty,h,life:rand(.6,1),max:1,r:rand(2,4)*k,pull:true,slow:true});}
function float(f,text,col,sz=1,dy=0){const [x,y]=wpos(f);B.floats.push({x:x+rand(-16,16)*k,y:y-ER()*(.6+dy*-.35)+dy*30*k,text,col,sz,t:0});}
async function choreo(a,d,special,h){
  const [ax,ay]=wpos(a),[dx,dy]=wpos(d),R=ER();
  if(!special){
    charge(a,.25);snd(600,.2,'sine',.02,2);await sleep(230);
    a.lunge=1;B.fx.push({type:'beam',x0:ax,y0:ay,x1:dx,y1:dy,t:0,max:.38,hue:a.hue,w:6});snd(900,.12,'square',.02,.3);
    await sleep(170);return;
  }
  switch(a.skill){
    case 'blaze':

      B.fx.push({type:'flame',x:dx,y:dy,t:0,max:1.1});noise(.8,.06,1200);for(let i=0;i<40;i++)B.parts.push({x:dx+rand(-R,R),y:dy+rand(-R*.5,R*.5),vx:rand(-30,30)*k,vy:-rand(60,200)*k,h:rand(5,40),life:rand(.6,1.4),max:1.4,r:rand(2,4)*k});
      break;
    case 'tide':

    case 'gale':{
      const n=6;for(let i=0;i<n;i++)B.fx.push({type:'blade',x:dx,y:dy,a:rand(0,TAU),t:-i*.06,max:.5,hue:a.hue});
      snd(1500,.5,'sawtooth',.02,.3);noise(.6,.05,3000);await sleep(330);break;}
    case 'quake':{
      const pts=[];for(let i=0;i<=16;i++)pts.push([ax+(dx-ax)*i/16,FLOOR()+rand(-10,10)*k*(i%2?1:-1)]);
      B.fx.push({type:'crack',pts,t:0,max:1.3,hue:a.hue});noise(1,.08,300);snd(60,1,'sawtooth',.06,.5);await sleep(420);
      for(let i=0;i<30;i++)B.parts.push({x:dx+rand(-R*.7,R*.7),y:FLOOR(),vx:rand(-60,60)*k,vy:-rand(200,480)*k,h:a.hue,life:rand(.6,1.1),max:1.1,r:rand(3,6)*k,shard:true,rot:rand(0,TAU),g:true});
      break;}
    case 'null':
      B.fx.push({type:'void',x:dx,y:dy,t:0,max:1.2,hue:a.hue});snd(110,1.1,'sine',.07,.3);
      for(let i=0;i<50;i++){const an=rand(0,TAU),r=R*rand(1.5,3);B.parts.push({x:dx+Math.cos(an)*r,y:dy+Math.sin(an)*r,tx:dx,ty:dy,h:a.hue,life:rand(.5,.9),max:.9,r:rand(2,3.5)*k,pull:true,swirl:1});}
      await sleep(650);break;

function updateBattle(rdt,now){
  if(B.introOn){B.intro+=rdt;if(B.intro>=3.4&&B.introRes){const r=B.introRes;B.introRes=null;r();}}
  B.stop-=rdt;const dt=B.stop>0?0:rdt*B.ts;B.vt+=dt;
  for(const f of [B.p,B.e]){f.hit=Math.max(0,f.hit-rdt*3);f.lunge=Math.max(0,f.lunge-dt*3.2);f.dhp+=(f.hp-f.dhp)*Math.min(1,rdt*4);}
  B.fx=B.fx.filter(f=>(f.t+=dt)<f.max);
  for(const p of B.parts){
    if(p.pull){const s=p.slow?3:7;p.x+=(p.tx-p.x)*Math.min(1,dt*s);p.y+=(p.ty-p.y)*Math.min(1,dt*s);
      if(p.swirl){const dx=p.x-p.tx,dy=p.y-p.ty;p.x=p.tx+dx*Math.cos(dt*5)-dy*Math.sin(dt*5);p.y=p.ty+dx*Math.sin(dt*5)+dy*Math.cos(dt*5);}}
    else{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=520*k*dt;p.vx*=Math.pow(.25,dt);if(!p.g)p.vy*=Math.pow(.25,dt);if(p.rot!=null)p.rot+=dt*6;}
    p.life-=dt;
  }
  B.parts=B.parts.filter(p=>p.life>0);
  B.floats=B.floats.filter(f=>(f.t+=rdt)<1.5);
  if(B.banner&&(B.banner.t+=rdt)>1.4)B.banner=null;
  if(B.gres&&(B.gres.t+=rdt)>.9)B.gres=null;
  if(B.gmark&&(B.gmark.t+=rdt)>.6)B.gmark=null;
  if(B.flash&&(B.flash.a-=rdt*1.6)<=0)B.flash=null;
  B.glitch=Math.max(0,B.glitch-rdt);
  B.shake*=Math.pow(.015,rdt);
  for(const key of ['x','y','z'])B.cam[key]+=(B.camT[key]-B.cam[key])*Math.min(1,rdt*5);
  if(B.gauge){const el=now-B.gauge.t0;if(B.gauge.replay!=null){if(el>520)finishGauge(B.gauge.replay);}else if(el>3200)stopGauge();}
}

  const by=y+90*k,bw=w-8*k,bx=f.side?x:x+8*k;
  ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(bx,by,bw,7*k);
  const lag=bw*f.dhp/f.maxhp,cur=bw*f.hp/f.maxhp;
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(f.side?bx+bw-lag:bx,by,lag,7*k);
  const hg=ctx.createLinearGradient(bx,0,bx+bw,0);hg.addColorStop(0,hsla(f.hue,100,50,1));hg.addColorStop(1,hsla(f.hue+20,100,70,1));
  ctx.fillStyle=f.hp/f.maxhp<.25?`hsla(0,100%,62%,${.7+.3*Math.sin(T*10)})`:hg;ctx.fillRect(f.side?bx+bw-cur:bx,by,cur,7*k);
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(bx,by+11*k,bw,3*k);
  const pw=bw*f.pp/f.maxpp;ctx.fillStyle='#ffc45e';ctx.fillRect(f.side?bx+bw-pw:bx,by+11*k,pw,3*k);
  txt(`PP ${f.pp}/${f.maxpp}　ST ${f.st}　DF ${f.df}　SPD ${f.spd}`,f.side?bx+bw:bx,by+30*k,11.5*k,'rgba(214,236,245,.72)',al,600,1);
  ctx.restore();
}
function drawGlitch(){
  if(B.glitch<=0)return;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  for(let i=0;i<7;i++){const y=Math.random()*H*DPR,h=rand(6,40)*DPR,dx=rand(-40,40)*DPR*B.glitch;
    try{ctx.drawImage(cv,0,y,CW*DPR,h,dx,y,CW*DPR,h);}catch(_){}}
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(255,0,80,${.08*B.glitch})`;ctx.fillRect(rand(-8,8),0,CW*DPR,H*DPR);
  ctx.restore();
}
function drawBattle(now){
  drawSky();
  ctx.save();
  const sx=(Math.random()-.5)*B.shake,sy=(Math.random()-.5)*B.shake;
  ctx.translate(CW/2+sx,H*.5+sy);ctx.scale(B.cam.z,B.cam.z);ctx.translate(-B.cam.x,-B.cam.y);
  drawFloor();drawFighters();drawFx();
  for(const f of B.floats){const q=f.t/1.5,a=q<.1?q*10:1-Math.max(0,(q-.6)/.4),yy=f.y-f.t*46*k,sc=f.sz*(1+Math.max(0,.15-f.t)*3);
    ctx.save();ctx.globalAlpha=a;ctx.shadowColor=f.col;ctx.shadowBlur=16;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';
    ctx.font=`900 ${28*k*sc}px "Yu Gothic UI",sans-serif`;ctx.textAlign='center';ctx.strokeText(f.text,f.x,yy);ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,yy);ctx.restore();}
  ctx.restore();
  if(B.flash){ctx.save();ctx.globalCompositeOperation=B.flash.white?'source-over':'lighter';ctx.fillStyle=B.flash.white?`rgba(255,255,255,${B.flash.a*.7})`:hsla(B.flash.h,100,60,B.flash.a*.45);ctx.fillRect(0,0,CW,H);ctx.restore();}
  const vg=ctx.createRadialGradient(CW/2,H/2,Math.min(CW,H)*.35,CW/2,H/2,Math.max(CW,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,CW,H);
  if(B.introOn)drawIntro();
  const ha=B.introOn?clamp((B.intro-1.8)/.4,0,1):1;
  if(ha>0){hud(B.p,ha);hud(B.e,ha);
    ctx.globalAlpha=ha;txt(`ROUND ${B.round}`,CW/2,32*k,14*k,'rgba(214,236,245,.65)','center',800,5);
    txt(B.opts.label+(B.opts.mode==='replay'?'　─ REPLAY':''),CW/2,52*k,11*k,B.opts.mode==='replay'?'#ffc45e':'rgba(160,200,220,.5)','center',700,2);
    const mp=matchup(B.p.el,B.e.el);txt(`相性 ${mp.t} ×${mp.m.toFixed(2)}`,CW/2,72*k,11*k,mp.c,'center',700,1);ctx.globalAlpha=1;}
  if(B.banner){const t=B.banner.t,a=Math.min(1,t*6)*Math.min(1,(1.4-t)*4),x=CW/2,y=H*.2;
    ctx.save();ctx.globalCompositeOperation='lighter';const bw=CW*.7*Math.min(1,t*4);const bg=ctx.createLinearGradient(x-bw/2,0,x+bw/2,0);
    bg.addColorStop(0,hsla(B.banner.hue,100,50,0));bg.addColorStop(.5,hsla(B.banner.hue,100,50,.3*a));bg.addColorStop(1,hsla(B.banner.hue,100,50,0));ctx.fillStyle=bg;ctx.fillRect(x-bw/2,y-40*k,bw,64*k);ctx.restore();
    ctx.save();ctx.shadowColor=hsla(B.banner.hue,100,60,1);ctx.shadowBlur=30;txt(B.banner.text,x+(1-Math.min(1,t*5))*60*k,y,44*k,hsla(B.banner.hue,100,88,a),'center',900,14);ctx.restore();
    txt(B.banner.sub,x,y+24*k,12*k,`rgba(230,240,250,${a*.8})`,'center',600,2);}
  if(B.gauge||B.gmark){
    const gw=440*k,gx=CW/2-gw/2,gy=H*.82,gh=16*k;
    const ph=B.gauge?gaugePos(now-B.gauge.t0):B.gmark.pos;
    ctx.save();ctx.globalAlpha=B.gauge?1:1-B.gmark.t/.6;
    ctx.fillStyle='rgba(2,8,16,.7)';ctx.beginPath();ctx.roundRect(gx-16,gy-36*k,gw+32,gh+52*k,10);ctx.fill();
    ctx.fillStyle='rgba(98,240,255,.08)';ctx.fillRect(gx,gy,gw,gh);
    ctx.fillStyle='rgba(98,240,255,.22)';ctx.fillRect(gx+gw*.34,gy,gw*.32,gh);
    ctx.fillStyle='rgba(255,196,94,.75)';ctx.fillRect(gx+gw*.45,gy,gw*.1,gh);
    if(ph!=null){ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ff5d73';ctx.fillRect(gx+gw*ph-1.5,gy-8*k,3,gh+16*k);glow(gx+gw*ph,gy+gh/2,18*k,350,.9,70);}
    ctx.restore();
    txt(B.gauge&&B.gauge.replay!=null?'REPLAY INPUT':'SCAN TIMING ─ クリック / Space で止める',CW/2,gy-12*k,12*k,'rgba(214,236,245,.85)','center',700,2);
  }
  if(B.gres){const a=1-B.gres.t/.9;txt(B.gres.l,CW/2,H*.76,26*k,B.gres.l==='PERFECT'?`rgba(255,215,140,${a})`:B.gres.l==='GOOD'?`rgba(140,240,255,${a})`:`rgba(255,140,150,${a})`,'center',900,6);}
  if(B.result){
    const win=B.result==='WIN';
    ctx.save();ctx.shadowColor=win?'rgba(98,240,255,.9)':'rgba(255,90,110,.9)';ctx.shadowBlur=40;
    txt(B.opts.mode==='replay'?`${win?B.p.name:B.e.name} WINS`:B.result,CW/2,H*.3,(B.opts.mode==='replay'?52:84)*k,win?'#dffcff':'#ffc0c8','center',900,B.opts.mode==='replay'?8:20);ctx.restore();
    if(B.opts.mode==='replay')txt(B.broken?'記録に不整合があります（改変の可能性）':'REPLAY VERIFIED ─ 同じ乱数と入力から同じ結果を再現しました',CW/2,H*.3+36*k,13*k,B.broken?'#ff9aa8':'#ffc45e','center',700,1);
  }
  drawGlitch();
}

// ================= battle UI / end =================
function renderCmds(){
  const c=$('cmds');
  if(!B||B.introOn){c.innerHTML='';return;}
  if(B.endRes){
    const m=B.opts.mode;let h='';
    if(m==='duel')h+=`<button class="xp" data-c="postres">結果をXにポスト<small>REPLAY URL</small></button><button data-c="again">再戦<small>REMATCH</small></button>`;
    if(m==='replay')h+=`<button data-c="chp">${esc(B.p.name)}に挑む<small>CHALLENGE</small></button><button data-c="che">${esc(B.e.name)}に挑む<small>CHALLENGE</small></button>`;
    c.innerHTML=h+`<button data-c="end">スキャナーへ<small>BACK</small></button>`;return;
  }
  if(!B.ask){c.innerHTML='';return;}
  const p=B.p,cost=spCost(p.skill);
  c.innerHTML=`<button data-c="attack">攻撃<small>ATTACK</small></button>`+
    `<button data-c="special" ${p.pp<cost?'disabled':''}>${SKILL[p.skill].jp}<small>PP ${cost}</small></button>`+
    `<button data-c="defend">防御<small>GUARD / PP+4</small></button>`+
    (B.opts.mode==='tower'?G.items.map((it,i)=>`<button class="it" data-c="item" data-i="${i}">${esc(it.name)}<small>ITEM</small></button>`).join(''):'');
}
$('cmds').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled||!B)return;
  const c=b.dataset.c;
  if(B.endRes){if(c==='postres'){postResult();return;}const r=B.endRes;B.endRes=null;r(c);return;}
  if(!B.ask)return;const r=B.ask;B.ask=null;renderCmds();r({type:c,item:+b.dataset.i});
});
function endBattle(win,action){
  const p=B.p,e=B.e,o=B.opts;
  if(o.mode==='tower'){
    if(win){G.tower.floor++;G.tower.hp=Math.min(p.maxhp,p.hp+Math.round(p.maxhp*.4));
      if(G.tower.floor>=5){log('バトルタワー制覇！','#ffe0a8');G.tower={active:false,floor:0,hp:0};}}
    else G.tower={active:false,floor:0,hp:0};
  }
  const pw=p.w,ew=e.w;
  B=null;renderCmds();G.mode='scan';G.reveal=null;
  if(action==='again'){startBattle(pw,ew,{mode:'duel',label:o.label});return;}
  if(action==='chp'){G.challenger=pw;log(`挑戦相手に「${pw.name}」を設定しました`,'#ff9aa8');}
  if(action==='che'){G.challenger=ew;log(`挑戦相手に「${ew.name}」を設定しました`,'#ff9aa8');}
  if(o.mode==='replay')history.replaceState(null,'',location.pathname+(G.challenger?'?vs='+G.challenger.id:''));
  renderPanel();
}

// ================= sharing =================
const baseURL=()=>/^https?:$/.test(location.protocol)?location.origin+location.pathname:PUBLIC_URL;
function postX(text,url){window.open('https://x.com/intent/post?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(url),'_blank','noopener');}
function shareHero(){
  const w=G.hero;if(!w)return;
  postX(`【ラックスコード挑戦状】\n${TECH[w.tech].jp}で呼び出した「${w.name}」${w.title} ${'★'.repeat(w.stars)}\nHP${w.hp} ST${w.st} DF${w.df} SPD${w.spd}／必殺 ${SKILL[w.skill].jp}\nこの戦士に勝てるか？ #ラックスコード`,baseURL()+'?vs='+w.id);
}
function postResult(){
  if(!B)return;const p=B.p,e=B.e,win=B.result==='WIN';
  const url=baseURL()+`?duel=${e.w.id}&me=${p.w.id}&seed=${B.seed}&in=${B.inputs.join('_')}`;
  postX(`【ラックスコード】${p.name}（${TECH[p.w.tech].jp}）が「${e.name}」に${win?'勝利':'敗北'}！ ${B.round}ラウンド\n対戦を再生して確かめる↓\n自分の戦士への挑戦はこちら ${baseURL()}?vs=${p.w.id}\n#ラックスコード`,url);
}
function saveImage(w){
  if(!w)return;
  const c=document.createElement('canvas');c.width=1200;c.height=630;
  const old=ctx,ok=k;ctx=c.getContext('2d');k=1;
  const g=ctx.createLinearGradient(0,0,0,630);g.addColorStop(0,'#061020');g.addColorStop(1,'#010307');ctx.fillStyle=g;ctx.fillRect(0,0,1200,630);
  ctx.strokeStyle='rgba(98,240,255,.05)';ctx.beginPath();for(let x=0;x<1200;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,630);}for(let y=0;y<630;y+=40){ctx.moveTo(0,y);ctx.lineTo(1200,y);}ctx.stroke();
  drawEntity(w,300,300,170,T);
  drawWarriorInfo(w,1,560,20,480,1.15,w.tech!=='NORMAL'?{tp:1,text:`${TECH[w.tech].jp}!!`,sub:TECH[w.tech].en}:null,'LUXCODE WARRIOR');
  ctx.fillStyle='#eef5f8';ctx.beginPath();ctx.roundRect(560,520,95*3+24,64,5);ctx.fill();
  drawBars(encode([...w.card].map(Number)),572,526,3,44,'#05080c',8);
  txt(w.card,572+142,580,11,'#05080c','center',700,3);
  txt('#ラックスコード',1170,560,22,'#ffc45e','right',900,2);
  txt('LUXCODE BARCODE BATTLER',1170,590,12,'rgba(160,200,220,.6)','right',700,4);
  ctx=old;k=ok;
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`luxcode_${w.name}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);});
}

// ================= panel =================
function setTarget(t){G.target=t;$('tSelf').classList.toggle('on',t==='self');$('tEnemy').classList.toggle('on',t==='enemy');}
function warriorCard(w,extra){
  return `<div class="wn" style="color:${hsla(w.hue,100,78,1)}">${esc(w.name)}</div><div class="sub">${esc(w.title)}　${'★'.repeat(w.stars)}　${TECH[w.tech].jp}（${w.rec||''}）</div>
    <div class="stl"><span><i>HP</i>${extra||''}${w.hp}</span><span><i>ST</i>${w.st}</span><span><i>DF</i>${w.df}</span><span><i>SPD</i>${w.spd}</span><span><i>PP</i>${w.pp}</span></div>
    <div class="sub" style="margin-top:6px">必殺 ${SKILL[w.skill].jp} ─ ${SKILL[w.skill].desc}</div>`;
}
function renderPanel(){
  const h=G.hero,busy=G.mode==='battle';
  let s='<h3>自分の戦士</h3>';
  if(h)s+=warriorCard(h,G.tower.active?G.tower.hp+'/':'')+
    `<div class="row"><button class="b x" id="shareBtn" style="flex:1" ${busy?'disabled':''}>挑戦状をXにポスト</button><button class="b" id="imgBtn" ${busy?'disabled':''}>画像を保存</button></div>`;
  else s+='<div class="sub">まだ読み込んでいません。</div>';
  s+=`<div class="chips">${G.items.map(i=>`<span class="chip">${esc(i.name)}</span>`).join('')||'<span class="sub">アイテムなし（最大4つ・タワーで使用）</span>'}</div>`;
  $('heroBox').innerHTML=s;
  if(h){$('shareBtn').onclick=shareHero;$('imgBtn').onclick=()=>saveImage(G.hero);}
  const ch=G.challenger,cb=$('chBox');
  if(ch){cb.style.display='';
    const mp=h?matchup(h.el,ch.el):null;
    cb.innerHTML=`<h3>CHALLENGER ─ 挑戦状</h3>${warriorCard(ch)}${mp?`<div class="sub" style="color:${mp.c}">あなたの${esc(h.name)}から見た相性：${mp.t}（×${mp.m.toFixed(2)}）</div>`:''}
      <div class="row"><button class="b red" id="acceptBtn" style="flex:1" ${!h||busy?'disabled':''}>${h?'挑戦を受ける':'先に自分のカードを読み込む'}</button><button class="b" id="dropBtn" ${busy?'disabled':''}>破棄</button></div>`;
    $('acceptBtn').onclick=()=>{if(G.hero&&G.challenger)startBattle(G.hero,G.challenger,{mode:'duel',label:'挑戦状バトル'});};
    $('dropBtn').onclick=()=>{G.challenger=null;history.replaceState(null,'',location.pathname);renderPanel();};
  }else cb.style.display='none';
  const tb=$('towerBtn');tb.disabled=!h||busy;
  tb.textContent=G.tower.active?`バトルタワー 第${G.tower.floor+1}層へ`:'バトルタワーに挑む（全5層）';
  $('tEnemy').disabled=!h;
  $('techs').innerHTML=Object.entries(TECH).map(([key,t])=>`<div class="tech ${G.lastTech===key?'hit':''}"><b>${t.jp}</b><span>${t.how}</span></div>`).join('');
  $('log').innerHTML=G.log.slice(-8).map(l=>`<div style="${l.c?'color:'+l.c:''}">${esc(l.m)}</div>`).join('');
}
$('preset').innerHTML=PRESETS.map(([b,l],i)=>`<option value="${i}">${l}　${b}${cdig([...b].map(Number))}</option>`).join('');
$('preset').onchange=e=>{const [b,l]=PRESETS[+e.target.value];setCard(b+cdig([...b].map(Number)),l);};
$('janBtn').onclick=()=>{
  let v=$('jan').value.replace(/\D/g,'');const msg=$('msg');msg.textContent='';
  if(v.length===8)v='00000'+v;
  if(v.length===12)v+=cdig([...v].map(Number));
  if(v.length!==13){msg.textContent='8桁・12桁・13桁の数字を入力してください。';return;}
  const d=[...v].map(Number);
  if(cdig(d)!==d[12]){msg.textContent=`チェックデジットが違うため ${d[12]}→${cdig(d)} に補正しました。`;d[12]=cdig(d);v=d.join('');}
  setCard(v,'JAN '+v.slice(0,4));
};
$('rndBtn').onclick=()=>{const d=Array.from({length:12},()=>Math.floor(Math.random()*10));setCard(d.join('')+cdig(d),'RANDOM');};
$('insR').onclick=()=>{if(G.sess||G.mode!=='scan')return;G.insertSide='right';$('insR').classList.add('on');$('insL').classList.remove('on');resetCard(false);};
$('insL').onclick=()=>{if(G.sess||G.mode!=='scan')return;G.insertSide='left';$('insL').classList.add('on');$('insR').classList.remove('on');resetCard(false);};
$('tSelf').onclick=()=>setTarget('self');
$('tEnemy').onclick=()=>{if(G.hero)setTarget('enemy');};
$('towerBtn').onclick=()=>{
  if(!G.hero||G.mode!=='scan'||G.sess)return;
  if(!G.tower.active)G.tower={active:true,floor:0,hp:G.hero.hp};
  const f=G.tower.floor;startBattle(G.hero,TOWER[f],{mode:'tower',scale:TSCALE[f],hp:G.tower.hp,label:`バトルタワー 第${f+1}層${f===4?'（塔主）':''}`});
};

// ================= input =================
function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(G.mode==='battle'){if(B&&B.introOn)B.intro=Math.max(B.intro,3.4);else stopGauge();return;}
  const g=geo();
  if(!G.ret&&e.clientX>=G.cardX&&e.clientX<=G.cardX+g.cw&&e.clientY>=g.cardTop&&e.clientY<=g.cardTop+g.ch){
    G.dragging=true;G.grabDX=e.clientX-G.cardX;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';}
});
cv.addEventListener('pointermove',e=>{
  if(G.mode!=='scan')return;const g=geo();
  if(G.dragging)G.cardX=clamp(e.clientX-G.grabDX,g.leftStart-90*k,g.rightStart+90*k);
  else cv.style.cursor=(e.clientX>=G.cardX&&e.clientX<=G.cardX+g.cw&&e.clientY>=g.cardTop&&e.clientY<=g.cardTop+g.ch)?'grab':'';
});
const release=()=>{G.dragging=false;cv.style.cursor='';};
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(e.code==='Space'&&G.mode==='battle'){e.preventDefault();if(B&&B.introOn)B.intro=Math.max(B.intro,3.4);else stopGauge();}});
addEventListener('resize',layout);

// ================= URL: challenges and replays =================
function loadFromURL(){
  const Q=new URLSearchParams(location.search);
  const vs=Q.get('vs');
  if(vs){const w=warriorFromId(vs);if(w){G.challenger=w;log(`挑戦状が届きました：「${w.name}」${w.title}`,'#ff9aa8');}else log('挑戦状URLの形式が正しくありません。','#ff9aa8');}
  const du=Q.get('duel'),me=Q.get('me'),seed=Q.get('seed'),inp=Q.get('in');
  if(du&&me&&seed!=null&&inp!=null){
    const ew=warriorFromId(du),pw=warriorFromId(me),sd=Number(seed);
    if(ew&&pw&&Number.isInteger(sd)&&sd>=0&&sd<4294967296){
      $('ovT').textContent='BATTLE REPLAY';
      $('ovP').innerHTML=`<b style="color:${hsla(pw.hue,100,78,1)}">${esc(pw.name)}</b>（${TECH[pw.tech].jp}）　vs　<b style="color:${hsla(ew.hue,100,78,1)}">${esc(ew.name)}</b>（${TECH[ew.tech].jp}）<br>記録された乱数と入力から、対戦をそのまま再現します。`;
      $('ov').classList.add('on');
      $('ovB').onclick=()=>{ensureAudio();$('ov').classList.remove('on');startBattle(pw,ew,{mode:'replay',seed:sd,inputs:inp.split('_').filter(Boolean),label:'対戦記録'});};
    }else log('対戦記録URLの形式が正しくありません。','#ff9aa8');
  }
}

// ================= loop =================
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.mode==='scan'){
    scanUpdate(now,dt);const g=geo();
    drawBg();drawReveal(g,now);drawReader(g,now);drawCard(g);drawSlot(g,now);drawTrace(g,now);
  }else if(B){updateBattle(dt,now);drawBattle(now);}
  requestAnimationFrame(frame);
}
setCard(PRESETS[0][0]+cdig([...PRESETS[0][0]].map(Number)),PRESETS[0][1]);
layout();
log('カードを読み取り口に通して戦士を呼び出してください。');
loadFromURL();
renderPanel();
requestAnimationFrame(frame);
</script>
